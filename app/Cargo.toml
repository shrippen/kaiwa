[package]
name = "kaiwa-app"
version = "0.1.0"
description = "Kaiwa, the Kirigami app (Kante GUI over kaiwa-core)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "kaiwa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cxx = "1.0.203"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml"] }
kaiwa-ai = { path = "../crates/kaiwa-ai" }
kaiwa-backend = { path = "../crates/kaiwa-backend" }
kaiwa-core = { path = "../crates/kaiwa-core" }
kaiwa-speech = { path = "../crates/kaiwa-speech" }
kaiwa-store = { path = "../crates/kaiwa-store" }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
hound = "3.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cxx-qt-build = "0.10.0"

# The cxx-qt bridge needs unsafe extern blocks, so the workspace's forbid(unsafe_code) is
# relaxed here only; hand-written unsafe stays out (see src/).
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
