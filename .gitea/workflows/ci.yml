# CI: format, lint, tests, persona validation.
#
# This same file lives in .gitea/workflows and .github/workflows: Gitea reads the copy in
# .gitea/workflows, GitHub only ever reads .github/workflows. Kept as two files, so a change
# here is a reminder to update the other one too (as in Kante).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Personas
        run: cargo run -q -p kaiwa-sim -- validate

  # The Qt side (G-01: Arch Linux container, current Qt 6 and KF6 from the packages).
  # Also the probe for G-02: the first step fails unless the job really runs in the container.
  qt:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QMAKE: /usr/bin/qmake6
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Runs in the Arch container
        run: grep -q '^ID=arch' /etc/os-release
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs base-devel rust qt6-base qt6-declarative qt6-shadertools qt6-svg kirigami
      - uses: actions/checkout@v4
      - name: Kante (public mirror)
        run: git clone --depth 1 https://github.com/shrippen/Kante.git ../Kante
      - name: Build spike 0.2
        working-directory: spikes/s02-qt
        run: cargo build --locked
      - name: Run spike 0.2 offscreen
        working-directory: spikes/s02-qt
        run: |
          export KANTE_QML="$GITHUB_WORKSPACE/../Kante/qml"
          timeout 60 ./target/debug/s02-qt --shot /tmp/spike.png --kind 1 2>&1 | tee /tmp/spike.log
          test -s /tmp/spike.png
          ! grep -E 'qrc:.*(Error|Unable|is not)' /tmp/spike.log
