# PR-Agent settings for Kaiwa (.gitea/workflows/pr-agent.yml); the rest
# are PR-Agent's defaults.
[config]
git_provider = "gitea"
response_language = "de-DE"
max_model_tokens = 128000
fallback_models = []
publish_output_progress = false
# The repository rules go along as context.
repo_context_files = ["agent.md"]

[pr_reviewer]
num_max_findings = 5
require_can_be_split_review = true
enable_review_labels_effort = false
enable_review_labels_security = false
extra_instructions = """
You review pull requests of Kaiwa, a Japanese conversation trainer:
Rust core (kaiwa-core, kaiwa-ai, kaiwa-speech, kaiwa-store, kaiwa-sim),
a Qt 6 / Kirigami app via cxx-qt (app/), QA personas (qa/). The PRs are
written by an AI agent; review them as a careful second reader, not as
their author.

Report only findings that matter:
- Bugs: a concrete input or state and the wrong result or crash it gives.
  Name file and line.
- Privacy and keys: learner data or audio leaving the machine without the
  opt-in the spec requires, API keys in code, logs or exports.
- Japanese text handling that breaks on real input (kana, kanji,
  furigana, full-width characters, mora counting).
- A feature without its requirement id (spec/LASTENHEFT.md), tests or
  persona journey; personas changed to make a run pass.
- Docs (ROADMAP, spec, ADRs) that the change made wrong.
- Other breaches of the repository rules (agent.md).

Skip style, naming and formatting (rustfmt and clippy run separately),
praise, and guesses you cannot back with the diff. When you find
nothing that matters, say so in one line.
"""

[pr_code_suggestions]
extra_instructions = """
Only suggestions that fix a bug or a missing check; no style.
"""
