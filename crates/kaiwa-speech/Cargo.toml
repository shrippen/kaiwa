[package]
name = "kaiwa-speech"
version = "0.1.0"
description = "Speech for Kaiwa: microphone, speech recognition (ReazonSpeech via sherpa-onnx), the interim voice (Kokoro)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
bzip2 = { version = "0.5.2", default-features = false, features = ["libbz2-rs-sys"] }
cpal = "0.18.2"
kaiwa-lang = { path = "../kaiwa-lang" }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "api-28"] }
# Links nothing itself: ONNX Runtime 1.28 comes with sherpa-onnx.
ort-sys = { version = "2.0.0-rc.13", default-features = false, features = ["disable-linking"] }
lindera = { version = "6.2.0", features = ["embed-ipadic"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
sherpa-onnx = "1.13.8"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
ureq = "3.4.2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
hound = "3.5.1"
