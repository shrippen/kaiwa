[package]
name = "kaiwa-lang"
version = "0.1.0"
description = "Language data for Kaiwa: words of a sentence (lindera, IPADIC), readings (UniDic, downloaded), the dictionary package kaiwa-data (JMdict, KANJIDIC2, Kanjium accents)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = "1.1.10"
lindera = { version = "6.2.0", features = ["embed-ipadic"] }
lindera-dictionary = "6.2.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
unicode-normalization = "0.1.25"

[lints]
workspace = true
