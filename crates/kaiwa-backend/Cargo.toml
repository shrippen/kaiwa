[package]
name = "kaiwa-backend"
version = "0.1.0"
description = "What the Kaiwa app and the kaiwad service share: profile, content, views, short talks"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
kaiwa-ai = { path = "../kaiwa-ai" }
kaiwa-core = { path = "../kaiwa-core" }
kaiwa-lang = { path = "../kaiwa-lang" }
kaiwa-store = { path = "../kaiwa-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5.1"

[features]
# Screenshots and recorded tutor answers (KAIWA_DEMO). Never in a package.
demo = []

[lints]
workspace = true
