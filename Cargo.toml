[workspace]
resolver = "3"
members = ["crates/*", "app"]
# The app (Qt 6, Kirigami) and kaiwa-speech (sherpa-onnx libraries, ALSA) build in the CI job `qt`;
# plain `cargo` commands build the rest.
default-members = ["crates/kaiwa-ai", "crates/kaiwa-core", "crates/kaiwa-sim", "crates/kaiwa-store"]
# Spikes build on their own (Qt and other toolchains the CI does not have).
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://git.arianw.de/shrippen/Kaiwa"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
