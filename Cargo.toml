[workspace]
resolver = "3"
members = ["crates/*", "app"]
# The app needs Qt 6 and Kirigami; plain `cargo` commands build the rest, the CI job `qt` builds it.
default-members = ["crates/*"]
# Spikes build on their own (Qt and other toolchains the CI does not have).
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://git.arianw.de/shrippen/Kaiwa"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
