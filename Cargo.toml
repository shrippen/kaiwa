[workspace]
resolver = "3"
members = ["crates/*"]
# Spikes build on their own (Qt and other toolchains the CI does not have).
exclude = ["spikes"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://git.arianw.de/shrippen/Kaiwa"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
