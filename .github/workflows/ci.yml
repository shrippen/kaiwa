# CI: format, lint, tests, persona validation, the Qt side.
#
# Public mirror: Gitea pushes every branch and tag here on each commit. This runs the checks and
# reports them back to the commit on Gitea as the status "github / test", where the pull
# requests live (owner, 10.11.2026; as in Andon). There are no pull requests on GitHub, so
# everything runs on push. Gitea runs no CI of its own: .gitea/workflows holds pr-agent.yml only.
#
# Needs the secret GITEA_TOKEN: a Gitea token with write access to the repository (commit
# statuses).
#
# Stays local: everything with a microphone, sound output, speech models or the live tutor
# (spec/LOKALER-TEST.md).
name: CI

on:
  push:
    branches: ["**"]

# No concurrency group: every commit runs to the end and keeps its own status, a newer push does
# not cancel an older run.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/Kaiwa/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  rust:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # A missing status is no reason to fail the checks.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Personas
        run: cargo run -q -p kaiwa-sim -- validate
      - name: Journeys (text mode, recorded tutor answers)
        run: cargo run -q -p kaiwa-sim -- run

  # The Qt side (G-01: Arch Linux container, current Qt 6 and KF6 from the packages).
  # Also the probe for G-02: the first step fails unless the job really runs in the container.
  qt:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QMAKE: /usr/bin/qmake6
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Runs in the Arch container
        run: grep -q '^ID=arch' /etc/os-release
      - name: Tools
        run: pacman -Syu --noconfirm --needed git nodejs base-devel rust qt6-base qt6-declarative qt6-shadertools qt6-svg kirigami alsa-lib pkgconf
      - uses: actions/checkout@v4
      - name: Kante (public mirror)
        run: git clone --depth 1 https://github.com/shrippen/Kante.git ../Kante
      - name: Build spike 0.2
        working-directory: spikes/s02-qt
        run: cargo build --locked
      - name: Run spike 0.2 offscreen
        working-directory: spikes/s02-qt
        run: |
          export KANTE_QML="$GITHUB_WORKSPACE/../Kante/qml"
          timeout 60 ./target/debug/s02-qt --shot /tmp/spike.png --kind 1 2>&1 | tee /tmp/spike.log
          test -s /tmp/spike.png
          ! grep -E 'qrc:.*(Error|Unable|is not)' /tmp/spike.log
      - name: Kante copy matches Kante main (GUI rule)
        # In the container the checkout belongs to another user; without this git takes the
        # directory for no repository and the diff ends with its usage text (exit 129).
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/sync-kante.sh ../Kante
          git diff --exit-code -- app/qml
      - name: QML tests (the space bar as talk key, /LF100/)
        run: tools/qml-tests.sh
      - name: Speech crate (microphone, ReazonSpeech; the model test skips without a model)
        run: cargo test --locked -p kaiwa-speech
      - name: A package has no demo (Q-15)
        run: |
          cargo build --locked -p kaiwa-app
          packaging/check-release.sh target/debug/kaiwa
      - name: Build the app with the demo (screenshot mode, recorded answers)
        run: cargo build --locked -p kaiwa-app --features demo
      - name: One scripted conversation offscreen
        run: |
          export KAIWA_DEMO=1
          timeout 90 ./target/debug/kaiwa --shot /tmp/app.png --view talk --scenario n5-02-jikoshoukai --kind 1 --height 2300 \
            --say '?|マラです。よろしくおねがいします。|ビール二ください。|コーヒーを好きです。' 2>&1 | tee /tmp/app.log
          for v in start path review profile settings; do
            timeout 60 ./target/debug/kaiwa --shot /tmp/$v.png --view $v --kind 1 2>&1 | tee -a /tmp/app.log
            test -s /tmp/$v.png
          done
          test -s /tmp/app.png
          # The placement through its stages to the result (/LF200/).
          L='マラです。|ドイツから来ました。|よろしくおねがいします。|コーヒーが好きです。'
          timeout 120 ./target/debug/kaiwa --shot /tmp/place.png --view place --kind 1 --say "$L|$L|$L|$L|read:21" 2>&1 | tee -a /tmp/app.log
          test -s /tmp/place.png
          ! grep -E 'qrc:.*(Error|Unable|is not|TypeError|ReferenceError)' /tmp/app.log
      - name: Packaging files (/LL500/)
        run: |
          pacman -S --noconfirm --needed desktop-file-utils appstream
          desktop-file-validate packaging/org.shrippen.kaiwa.desktop
          appstreamcli validate --no-net packaging/org.shrippen.kaiwa.metainfo.xml
          bash -n packaging/arch/PKGBUILD

  # Also runs when a job failed or was cancelled, so Gitea never keeps a stale "pending".
  report:
    needs: [rust, qt]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          case "$RUST/$QT" in
            success/success) state=success; desc=success ;;
            *failure*) state=failure; desc="rust $RUST, qt $QT" ;;
            *) state=error; desc="rust $RUST, qt $QT" ;;
          esac
          if [ -n "$STARTED" ]; then desc="$desc in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RUST: ${{ needs.rust.result }}
          QT: ${{ needs.qt.result }}
          STARTED: ${{ needs.rust.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
